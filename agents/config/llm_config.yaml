# Configuration centralisée des modèles utilisés par tous les agents/services IA
# générative de Wink. Un seul endroit à modifier pour changer de modèle ou de
# fournisseur — évite d'avoir des noms de modèles codés en dur dispersés dans
# plusieurs fichiers Python (voir agents/config/loader.py pour la lecture).

document_processing:
  # Extraction de texte brut depuis un document (PDF) — service 0.0.2/0.0.3,
  # import de document à l'onboarding entrepreneur.
  # Pixtral (recommandé initialement dans "Wink — Extraction de document : deux
  # approches comparées") n'est plus disponible sur Groq — remplacé par
  # qwen/qwen3.6-27b, seul modèle vision actuellement hébergé par Groq
  # (vérifié le 25/08/2026 — https://console.groq.com/docs/vision).
  vlm:
    provider: groq
    model: qwen/qwen3.6-27b
    # Limite réelle de l'API Groq pour ce modèle : 3 images par requête (vérifié
    # le 30/08/2026 suite à une erreur 400 "Too many images provided" sur un
    # document de 11 pages avec l'ancienne valeur de 5 — la doc Groq a changé
    # cette limite depuis la vérification du 25/08/2026 ci-dessus).
    max_images_per_request: 3
    # 0 = aussi déterministe que possible : c'est une transcription fidèle qui
    # est demandée (voir prompts.yaml), pas une génération créative — sans ça,
    # un même document peut être transcrit différemment d'un appel à l'autre.
    temperature: 0

  # Extraction structurée (texte brut → champs typés par table) — 3 appels
  # séparés par document (projects, project_legal_profiles, project_public_profiles),
  # voir pipelines/default_pipeline.py.
  llm_structuration:
    provider: groq
    model: openai/gpt-oss-120b
    max_retries: 3
    # idem : extraction structurée déterministe attendue (voir "Ne déduis rien,
    # n'invente aucune valeur" dans prompts.yaml) — sans temperature=0, un même
    # document peut donner tantôt une valeur, tantôt null, pour le même champ.
    temperature: 0


# Génération d'embeddings pour le copilot (recherche sémantique) — service
# 1.1.x, Groupe 1/2. BGE-M3 en local (Option A, voir DECISIONS.md), mode Dense
# uniquement — dimension figée à 1024, voir EMBEDDING_DIMENSION dans
# backend/shared/knowledge_base/models/content_embeddings.py (les deux doivent
# rester cohérents si le modèle change un jour).
embedding:
  provider: local
  model: BAAI/bge-m3
  dimension: 1024
  mode: dense


# Structuration des articles de loi collectés depuis Légifrance (service 1.1.1,
# Groupe 2) — 2 appels distincts par article, voir
# agents/ingestion/legal_text_structuring_service.py. Modèle repris de
# document_processing.llm_structuration ci-dessus par défaut (même besoin :
# extraction structurée déterministe) — à ajuster séparément si la qualité sur
# du texte juridique s'avère différente en pratique.
legal_text_structuration:
  relevance_filter:
    provider: groq
    model: openai/gpt-oss-120b
    max_retries: 3
    temperature: 0
  classification:
    provider: groq
    model: openai/gpt-oss-120b
    max_retries: 3
    temperature: 0


# Classification des textes d'assurance sectoriels (service 1.1.10) — voir
# agents/ingestion/sector_insurance_structuring_service.py. Meme modele que
# legal_text_structuration (meme besoin : extraction structuree deterministe).
sector_insurance_structuration:
  page_relevance:
    provider: groq
    model: openai/gpt-oss-120b
    max_retries: 3
    temperature: 0
  classification:
    provider: groq
    model: openai/gpt-oss-120b
    max_retries: 3
    temperature: 0
  # Detection de chunking_suggere a partir du seul texte brut (pas de secteur
  # ni type_assurance en entree) — partagee par les 2 volets du service
  # 1.1.10 : volet 1 (Legifrance) et volet 2 (pages web, secteur pas encore
  # connu a ce stade du pipeline).
  chunking:
    provider: groq
    model: openai/gpt-oss-120b
    max_retries: 3
    temperature: 0
