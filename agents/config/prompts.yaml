# Prompts utilisés par les services du module d'extraction de document
# (agents/shared/document_processing/). Séparés du code pour pouvoir les ajuster
# sans toucher à vlm_service.py / llm_service.py — utile si on itère beaucoup sur
# la qualité d'extraction par essais/erreurs.
#
# {schema_json}, {text} et {schema_hints} dans llm_structuration.extraction sont
# remplacés par .format() dans llm_service.py — ne pas renommer ces placeholders
# sans mettre à jour le code appelant.

document_processing:
  vlm:
    # Volontairement minimal : on demande une transcription fidèle, pas une
    # interprétation — la structuration est le rôle du LLM d'après, pas du VLM.
    transcription: >-
      Transcris fidèlement tout le texte visible sur ces pages, dans l'ordre,
      sans commentaire ni reformulation.

  llm_structuration:
    # "Ne déduis rien, n'invente aucune valeur" est la partie critique : sans ça,
    # le LLM a tendance à halluciner des valeurs plausibles pour "compléter" le
    # schéma — dangereux ici car ces valeurs finissent dans project_field_values
    # puis potentiellement dans de vraies colonnes après validation utilisateur.
    # {schema_hints} est injecté par llm_service.py selon la table cible de
    # l'appel (voir schema_hints ci-dessous) — vide si aucun hint n'existe pour
    # cette table, le prompt reste alors identique à avant cet ajout.
    extraction: |
      Extrait uniquement les informations explicitement présentes dans le texte suivant, selon le schéma JSON fourni. Ne déduis rien, n'invente aucune valeur : si une information n'est pas mentionnée, laisse le champ à null.

      {schema_hints}

      Schéma JSON :
      {schema_json}

      Texte :
      {text}

    # Une entrée par table cible (voir default_pipeline.py, qui passe le nom de
    # table comme schema_key) — instructions propres au domaine de cette table,
    # que le prompt générique ci-dessus ne peut pas porter puisqu'il est partagé
    # par les 3 appels.
    schema_hints:
      projects: |
        Précisions pour ce schéma :
        - `description` : SEULE EXCEPTION à la règle "n'invente rien" ci-dessus. Si aucune phrase de description explicite n'existe dans le texte, rédige toi-même un résumé de 1 à 2 phrases de l'activité du projet, à partir de l'ensemble du texte (secteur, produit, cible). Ne laisse `description` à null que si le texte ne parle vraiment pas d'un projet/d'une startup.
        - `sector` vs `subsectors` : `sector` est le secteur d'activité principal (ex: "Fintech"), `subsectors` sont des sous-domaines plus précis à l'intérieur de ce secteur (ex: "paiement mobile", "assurance santé"). Ne mets pas la même valeur dans les deux.
        - `customer_segments` vs `target_users` : `customer_segments` désigne qui paie/achète (ex: "PME", "banques"), `target_users` désigne qui utilise réellement le produit au quotidien (ex: "commerçants", "salariés") — ces 2 listes peuvent être différentes, ne les confonds pas.
        - `project_type`/`stage` : n'extrait ces 2 champs que s'ils sont réellement déductibles du texte (ex: "nous avons créé la société en 2024" → project_type=created) ; en cas de doute, laisse à null plutôt que de deviner.

        Exemple :
        Texte : "Notre startup Fintech aide les PME à automatiser leur comptabilité. Nous ciblons les artisans et petites entreprises de moins de 10 salariés, basés en France."
        JSON attendu (extrait, autres champs omis) :
        {"sector": "Fintech", "customer_segments": ["PME"], "target_users": ["artisans", "petites entreprises de moins de 10 salariés"], "localisation": "France"}

      project_legal_profiles: |
        Précisions pour ce schéma :
        - `siren` : exactement 9 chiffres, sans espaces ni tirets — si le texte écrit "123 456 789", renvoie "123456789".
        - `siret` : exactement 14 chiffres (SIREN + 5 chiffres de NIC), même nettoyage des espaces/tirets.
        - `registration_date` : toujours au format ISO `YYYY-MM-DD`, même si le texte utilise un autre format (ex: "12/03/2024" → "2024-03-12").

      project_public_profiles: |
        Précisions pour ce schéma :
        - `public_summary` : résumé destiné à un affichage public (ex: vitrine investisseurs) — reformule si besoin pour rester concis (1 à 2 phrases), ce n'est pas nécessairement la même formulation qu'une description interne.


# Structuration des articles de loi collectés depuis Légifrance (service 1.1.1,
# Groupe 2) — voir agents/ingestion/legal_text_structuring_service.py.
# {texte_brut} et {schema_json} remplacés par .format() dans ce service — même
# convention que document_processing.llm_structuration ci-dessus.
legal_text_structuration:
  relevance_filter: |
    Voici le texte d'un article de loi français sur les sociétés/entreprises. Détermine s'il est pertinent pour un entrepreneur créant une startup — c'est-à-dire s'il correspond à un des sous-thèmes suivants : régime_social, gouvernance, fiscalité, responsabilité, capital_social. Réponds uniquement par pertinent ou non_pertinent, avec une justification courte d'une phrase.

    Réponds uniquement en JSON valide respectant ce schéma :
    {schema_json}

    Texte :
    {texte_brut}

  classification: |
    Voici le texte d'un article de loi sur les sociétés. Classe-le dans exactement une des catégories suivantes pour sous_theme : regime_social, gouvernance, fiscalite, responsabilite, capital_social. Indique enfin si les différents alinéas de cet article traitent d'un seul et même sujet cohérent, ou de sujets clairement distincts, pour chunking_suggere : réponds aucun (sujet unique) ou par_alinea (sujets distincts). Ne réponds qu'avec ces valeurs exactes, n'en invente aucune autre.

    Réponds uniquement en JSON valide respectant ce schéma :
    {schema_json}

    Texte :
    {texte_brut}


# Classification des textes collectes pour les assurances sectorielles
# (service 1.1.10) — voir agents/ingestion/sector_insurance_structuring_service.py.
# {texte_brut}, {secteur} et {schema_json} remplaces par .format() dans ce service.
sector_insurance_structuration:
  page_relevance: |
    Voici le titre et un extrait d'une page web. Le secteur d'activite recherche est : {secteur}.

    Determine si cette page parle des assurances (obligatoires ou recommandees) pertinentes pour une entreprise de ce secteur en France. Reponds uniquement par pertinent ou non_pertinent, avec une justification courte d'une phrase.

    Reponds uniquement en JSON valide respectant ce schema :
    {schema_json}

    Titre :
    {titre}

    Extrait :
    {extrait}

  classification: |
    Voici un texte relatif aux obligations d'assurance pour les entreprises en France. Le secteur d'activite concerne est : {secteur}.

    A partir de ce texte, identifie :
    1. `type_assurance` : le type d'assurance concerne (ex: "RC Pro", "Assurance decennale", "Assurance auto obligatoire", "Garantie financiere", "RC produit", "Cyber-risques", "Multirisque pro"...).
    2. `a_base_legale` : reponds `true` UNIQUEMENT si le texte cite explicitement une reference legale (article de loi, code, decret). Ne presume jamais — en cas de doute, reponds `false`.
    3. `chunking_suggere` : "aucun" si le texte traite d'un seul sujet coherent, "par_alinea" si les alineas traitent de sujets clairement distincts.

    Reponds uniquement en JSON valide respectant ce schema :
    {schema_json}

    Texte :
    {texte_brut}

  # Utilise par detect_chunking() — volontairement sans {secteur} : reutilisable
  # par le volet 2 (page web) avant meme que son secteur soit determine.
  chunking: |
    Voici un texte relatif aux assurances pour une entreprise en France.

    Determine uniquement si les differents alineas de ce texte traitent d'un seul et meme sujet coherent, ou de sujets clairement distincts, pour `chunking_suggere` : reponds `aucun` (sujet unique) ou `par_alinea` (sujets distincts). Ne reponds qu'avec ces valeurs exactes, n'en invente aucune autre.

    Reponds uniquement en JSON valide respectant ce schema :
    {schema_json}

    Texte :
    {texte_brut}
