# Prompts utilisés par les services du module d'extraction de document
# (agents/shared/document_processing/). Séparés du code pour pouvoir les ajuster
# sans toucher à vlm_service.py / llm_service.py — utile si on itère beaucoup sur
# la qualité d'extraction par essais/erreurs.
#
# {schema_json}, {text} et {schema_hints} dans llm_structuration.extraction sont
# remplacés par .format() dans llm_service.py — ne pas renommer ces placeholders
# sans mettre à jour le code appelant.

document_processing:
  vlm:
    # Volontairement minimal : on demande une transcription fidèle, pas une
    # interprétation — la structuration est le rôle du LLM d'après, pas du VLM.
    transcription: >-
      Transcris fidèlement tout le texte visible sur ces pages, dans l'ordre,
      sans commentaire ni reformulation.

  llm_structuration:
    # "Ne déduis rien, n'invente aucune valeur" est la partie critique : sans ça,
    # le LLM a tendance à halluciner des valeurs plausibles pour "compléter" le
    # schéma — dangereux ici car ces valeurs finissent dans project_field_values
    # puis potentiellement dans de vraies colonnes après validation utilisateur.
    # {schema_hints} est injecté par llm_service.py selon la table cible de
    # l'appel (voir schema_hints ci-dessous) — vide si aucun hint n'existe pour
    # cette table, le prompt reste alors identique à avant cet ajout.
    extraction: |
      Extrait uniquement les informations explicitement présentes dans le texte suivant, selon le schéma JSON fourni. Ne déduis rien, n'invente aucune valeur : si une information n'est pas mentionnée, laisse le champ à null.

      {schema_hints}

      Schéma JSON :
      {schema_json}

      Texte :
      {text}

    # Une entrée par table cible (voir default_pipeline.py, qui passe le nom de
    # table comme schema_key) — instructions propres au domaine de cette table,
    # que le prompt générique ci-dessus ne peut pas porter puisqu'il est partagé
    # par les 3 appels.
    schema_hints:
      projects: |
        Précisions pour ce schéma :
        - `description` : SEULE EXCEPTION à la règle "n'invente rien" ci-dessus. Si aucune phrase de description explicite n'existe dans le texte, rédige toi-même un résumé de 1 à 2 phrases de l'activité du projet, à partir de l'ensemble du texte (secteur, produit, cible). Ne laisse `description` à null que si le texte ne parle vraiment pas d'un projet/d'une startup.
        - `sector` vs `subsectors` : `sector` est le secteur d'activité principal (ex: "Fintech"), `subsectors` sont des sous-domaines plus précis à l'intérieur de ce secteur (ex: "paiement mobile", "assurance santé"). Ne mets pas la même valeur dans les deux.
        - `customer_segments` vs `target_users` : `customer_segments` désigne qui paie/achète (ex: "PME", "banques"), `target_users` désigne qui utilise réellement le produit au quotidien (ex: "commerçants", "salariés") — ces 2 listes peuvent être différentes, ne les confonds pas.
        - `project_type`/`stage` : n'extrait ces 2 champs que s'ils sont réellement déductibles du texte (ex: "nous avons créé la société en 2024" → project_type=created) ; en cas de doute, laisse à null plutôt que de deviner.

        Exemple :
        Texte : "Notre startup Fintech aide les PME à automatiser leur comptabilité. Nous ciblons les artisans et petites entreprises de moins de 10 salariés, basés en France."
        JSON attendu (extrait, autres champs omis) :
        {"sector": "Fintech", "customer_segments": ["PME"], "target_users": ["artisans", "petites entreprises de moins de 10 salariés"], "localisation": "France"}

      project_legal_profiles: |
        Précisions pour ce schéma :
        - `siren` : exactement 9 chiffres, sans espaces ni tirets — si le texte écrit "123 456 789", renvoie "123456789".
        - `siret` : exactement 14 chiffres (SIREN + 5 chiffres de NIC), même nettoyage des espaces/tirets.
        - `registration_date` : toujours au format ISO `YYYY-MM-DD`, même si le texte utilise un autre format (ex: "12/03/2024" → "2024-03-12").

      project_public_profiles: |
        Précisions pour ce schéma :
        - `public_summary` : résumé destiné à un affichage public (ex: vitrine investisseurs) — reformule si besoin pour rester concis (1 à 2 phrases), ce n'est pas nécessairement la même formulation qu'une description interne.


# Structuration des articles de loi collectés depuis Légifrance (service 1.1.1,
# Groupe 2) — voir agents/ingestion/legal_text_structuring_service.py.
# {texte_brut} et {schema_json} remplacés par .format() dans ce service — même
# convention que document_processing.llm_structuration ci-dessus.
legal_text_structuration:
  relevance_filter: |
    Voici le texte d'un article de loi français sur les sociétés/entreprises. Détermine s'il est pertinent pour un entrepreneur créant une startup — c'est-à-dire s'il correspond à un des sous-thèmes suivants : régime_social, gouvernance, fiscalité, responsabilité, capital_social. Réponds uniquement par pertinent ou non_pertinent, avec une justification courte d'une phrase.

    Réponds uniquement en JSON valide respectant ce schéma :
    {schema_json}

    Texte :
    {texte_brut}

  classification: |
    Voici le texte d'un article de loi sur les sociétés. Classe-le dans exactement une des catégories suivantes pour sous_theme : regime_social, gouvernance, fiscalite, responsabilite, capital_social. Indique enfin si les différents alinéas de cet article traitent d'un seul et même sujet cohérent, ou de sujets clairement distincts, pour chunking_suggere : réponds aucun (sujet unique) ou par_alinea (sujets distincts). Ne réponds qu'avec ces valeurs exactes, n'en invente aucune autre.

    Réponds uniquement en JSON valide respectant ce schéma :
    {schema_json}

    Texte :
    {texte_brut}


# Classification des textes collectes pour les assurances sectorielles
# (service 1.1.10) — voir agents/ingestion/sector_insurance_structuring_service.py.
# {texte_brut}, {secteur} et {schema_json} remplaces par .format() dans ce service.
sector_insurance_structuration:
  page_relevance: |
    Voici le titre et un extrait d'une page web. Le secteur d'activite recherche est : {secteur}.

    Determine si cette page parle des assurances (obligatoires ou recommandees) pertinentes pour une entreprise de ce secteur en France. Reponds uniquement par pertinent ou non_pertinent, avec une justification courte d'une phrase.

    Reponds uniquement en JSON valide respectant ce schema :
    {schema_json}

    Titre :
    {titre}

    Extrait :
    {extrait}

  classification: |
    Voici un texte relatif aux obligations d'assurance pour les entreprises en France. Le secteur d'activite concerne est : {secteur}.

    A partir de ce texte, identifie :
    1. `type_assurance` : le type d'assurance concerne (ex: "RC Pro", "Assurance decennale", "Assurance auto obligatoire", "Garantie financiere", "RC produit", "Cyber-risques", "Multirisque pro"...).
    2. `a_base_legale` : reponds `true` UNIQUEMENT si le texte cite explicitement une reference legale (article de loi, code, decret). Ne presume jamais — en cas de doute, reponds `false`.
    3. `chunking_suggere` : "aucun" si le texte traite d'un seul sujet coherent, "par_alinea" si les alineas traitent de sujets clairement distincts.

    Reponds uniquement en JSON valide respectant ce schema :
    {schema_json}

    Texte :
    {texte_brut}

  # Utilise par detect_chunking() — volontairement sans {secteur} : reutilisable
  # par le volet 2 (page web) avant meme que son secteur soit determine.
  chunking: |
    Voici un texte relatif aux assurances pour une entreprise en France.

    Determine uniquement si les differents alineas de ce texte traitent d'un seul et meme sujet coherent, ou de sujets clairement distincts, pour `chunking_suggere` : reponds `aucun` (sujet unique) ou `par_alinea` (sujets distincts). Ne reponds qu'avec ces valeurs exactes, n'en invente aucune autre.

    Reponds uniquement en JSON valide respectant ce schema :
    {schema_json}

    Texte :
    {texte_brut}

rgpd_text_structuration:
  relevance_filter: |
    Voici un extrait de texte lie au RGPD (article de la Loi n°78-17, ou guide/FAQ CNIL). Determine s'il est pertinent pour un entrepreneur qui doit comprendre ses obligations RGPD ou repondre a une question RGPD courante — c'est-a-dire s'il correspond a un des sous-themes suivants : registre_traitements, aipd, dpo, bases_legales, droits_personnes, securite_donnees, transferts_hors_ue. Reponds uniquement par pertinent ou non_pertinent, avec une justification courte d'une phrase.

    Reponds uniquement en JSON valide respectant ce schema :
    {schema_json}

    Texte :
    {texte_brut}
  classification: |
    Voici un extrait de texte lie au RGPD (article de la Loi n°78-17, ou guide/FAQ CNIL). Classe-le dans exactement une des categories suivantes pour sous_theme : registre_traitements, aipd, dpo, bases_legales, droits_personnes, securite_donnees, transferts_hors_ue. Indique enfin si les differentes parties de ce texte traitent d'un seul et meme sujet coherent, ou de sujets clairement distincts, pour chunking_suggere : reponds aucun (sujet unique) ou par_alinea (sujets distincts). Ne reponds qu'avec ces valeurs exactes, n'en invente aucune autre.

    Reponds uniquement en JSON valide respectant ce schema :
    {schema_json}

    Texte :
    {texte_brut}
secnumcloud_text_structuration:
  relevance_filter: |
    Voici un extrait de texte lie a la qualification SecNumCloud de l'ANSSI (referentiel d'exigences, ou FAQ/guide de qualification). Determine s'il est pertinent pour un entrepreneur qui veut comprendre le parcours, les exigences, le delai ou le cout de cette qualification -- c'est-a-dire s'il correspond a un des sous-themes suivants : exigences_techniques_securite, exigences_gouvernance_organisation, processus_qualification, delai_cout_duree_validite. Reponds uniquement par pertinent ou non_pertinent, avec une justification courte d'une phrase.

    Reponds uniquement en JSON valide respectant ce schema :
    {schema_json}

    Texte :
    {texte_brut}
  classification: |
    Voici un extrait de texte lie a la qualification SecNumCloud de l'ANSSI (referentiel d'exigences, ou FAQ/guide de qualification). Classe-le dans exactement une des categories suivantes pour sous_theme : exigences_techniques_securite, exigences_gouvernance_organisation, processus_qualification, delai_cout_duree_validite. Indique enfin si les differentes parties de ce texte traitent d'un seul et meme sujet coherent, ou de sujets clairement distincts, pour chunking_suggere : reponds aucun (sujet unique) ou par_alinea (sujets distincts). Ne reponds qu'avec ces valeurs exactes, n'en invente aucune autre.

    Reponds uniquement en JSON valide respectant ce schema :
    {schema_json}

    Texte :
    {texte_brut}
compliance_agent_rgpd:
  # Version agentique pour le diagnostic 3.3.1 (meme conversion que
  # compliance_agent_healthtech_gap) : l'agent lit le profil et recherche le
  # corpus via ses tools. L'AIPD (3.3.4, aipd_document/aipd_verification
  # ci-dessous) reste sur l'ancien pattern -- pipeline deterministe a
  # retrieval cible par section, pas une decision de recherche a laisser a
  # un agent (voir Wink_compliance_agent_recap.md).
  system: |
    Tu es le compliance_agent de Wink, specialise RGPD pour un entrepreneur francais.

    Utilise lire_profil_projet pour connaitre le profil de traitement de
    donnees du projet (cle "questionnaire_rgpd" -- booleens, null = pas
    encore repondu) et rechercher_corpus_reglementaire (domaine 'rgpd') pour
    trouver les articles/textes RGPD (Legifrance, CNIL, verifies)
    pertinents -- tu peux rechercher plusieurs fois avec des requetes
    differentes si les premiers resultats sont insuffisants. A partir de ces
    seuls elements, produis la liste des obligations RGPD qui s'appliquent
    reellement a ce profil.

    Regles strictes :
    - N'invente jamais une obligation qui n'est justifiee par aucun chunk reellement vu via rechercher_corpus_reglementaire pendant cette tache.
    - Certaines obligations sont quasi universelles (registre des traitements, base legale, information des personnes, securite des donnees) et s'appliquent a tout projet traitant la moindre donnee personnelle, meme si aucun champ du questionnaire n'est a true : recherche aussi ces obligations de base (ex: requete "registre des traitements et base legale RGPD") avant de conclure a une liste vide seulement parce qu'aucune case n'est cochee.
    - "description" doit etre une explication complete et comprehensible pour un non-juriste, jamais une simple instruction en un mot.
    - "source_id" doit etre le source_id exact d'un chunk vu via rechercher_corpus_reglementaire pendant cette tache, ou null si aucun chunk precis ne s'applique directement -- jamais un identifiant invente.
    - Un champ du questionnaire a null (question pas encore repondue) ne doit pas etre traite comme "non" : ignore les obligations conditionnelles qui dependraient de ce champ tant qu'il n'est pas renseigne, plutot que de supposer une reponse — cela ne concerne pas les obligations de base ci-dessus, qui ne dependent d'aucun champ.
    - "lie_a_aipd" doit etre true uniquement si cette obligation decoule d'un besoin d'analyse d'impact (AIPD) — c'est le cas si le chunk source qui la justifie porte explicitement sur l'AIPD/l'analyse d'impact, ou si l'obligation EST de realiser une AIPD. Pour toute autre obligation (registre, base legale, information des personnes, securite, sous-traitance...), mets false.

  aipd_document: |
    Tu es l'agent conformite de Wink, specialise RGPD pour un entrepreneur francais. Redige le contenu complet d'une AIPD guidee, structuree en 4 sections, a partir du profil du projet ci-dessous et des chunks sources fournis pour CHAQUE section separement (issus de sources RGPD verifiees : CNIL, Legifrance, recuperes specifiquement pour chaque section).

    Sections a rediger, dans cet ordre, chacune avec ses propres consignes et ses propres chunks sources :
    {sections_bloc}

    Regles strictes :
    - Pour chaque section, base-toi EXCLUSIVEMENT sur le profil du projet et sur les chunks fournis pour CETTE section. Tes connaissances generales sur le RGPD ne servent qu'a structurer et expliquer en langage clair — jamais a introduire un fait, un mecanisme juridique, une obligation ou un chiffre absent du profil ou des chunks de la section concernee.
    - Si les chunks d'une section ne couvrent pas un point necessaire, ne le deduis pas de tes connaissances generales : ecris explicitement que ce point n'est pas couvert par les sources disponibles et qu'il doit etre verifie avec un professionnel.
    - N'invente aucun fait sur le projet qui ne soit pas dans le profil.
    - Si un champ du profil est null (question pas encore repondue), ne suppose pas de reponse : mentionne que ce point reste a clarifier avec l'entrepreneur plutot que d'inventer une reponse.
    - Ne cite JAMAIS le nom d'un mecanisme juridique precis (ex. clauses contractuelles types, regles d'entreprise contraignantes, decision d'adequation, nom d'un accord de transfert de donnees specifique) sauf s'il apparait textuellement dans les chunks fournis. Sans confirmation dans les chunks, reste generique ("un mecanisme de transfert encadre conforme au RGPD, a valider avec un professionnel").
    - Langage clair, comprehensible par un non-juriste, jamais du jargon sans explication.
    - "contenu" est le texte complet des 4 sections, dans l'ordre, en une seule chaine (garde le titre de chaque section, utilise des sauts de ligne pour separer, pas de balises HTML/Markdown).

    Reponds uniquement en JSON valide respectant ce schema :
    {schema_json}

    Profil du projet :
    {profil_json}
  aipd_verification: |
    Tu es un verificateur de conformite RGPD. Voici une AIPD (analyse d'impact relative a la protection des donnees) deja redigee section par section, et l'ensemble des chunks sources utilises pour la produire.

    Ta tache : relis le document ci-dessous et verifie que CHAQUE affirmation (fait, mecanisme juridique precis, obligation, chiffre) est bien justifiee soit par les chunks fournis, soit formulee en langage generique neutre (du type "a valider avec un professionnel") plutot qu'affirmee comme un fait certain.

    Si tu trouves une affirmation non justifiee — en particulier le nom d'un mecanisme juridique precis (ex. nom d'un accord de transfert, d'une certification, d'une decision d'adequation) qui n'apparait pas textuellement dans les chunks — reformule-la en langage generique neutre, sans inventer de remplacement plus precis. Ne supprime et ne modifie pas le contenu deja correctement justifie.

    Renvoie le document corrige complet, dans la meme structure a 4 sections separees par des sauts de ligne, meme si aucune correction n'est necessaire.

    Reponds uniquement en JSON valide respectant ce schema :
    {schema_json}

    Document a verifier :
    {document_assemble}

    Chunks sources disponibles (toutes sections confondues) :
    {chunks_texte}
ai_act_text_structuration:
  batch_classification: |
    Tu recois plusieurs articles du reglement europeen sur l'IA (AI Act, reglement (UE) 2024/1689). Pour CHAQUE article ci-dessous, determine :
    - pertinent : est-ce que cet article impose une obligation ou definit une notion utile a un entrepreneur qui integre un modele d'IA dans son produit (true), ou est-ce un article purement procedural (entree en vigueur, transposition, dispositions finales/abrogations) sans interet pour ce besoin (false) ?
    - categorie_risque (uniquement si pertinent=true, sinon null) : classe l'article dans exactement une des categories suivantes : interdit (pratiques interdites, article 5), haut_risque (systemes d'IA a haut risque, annexe III, exigences associees), risque_limite (obligations de transparence, article 50 : chatbots, deepfakes, contenus generes), gouvernance_gpai (modeles d'IA a usage general, chapitre V), minimal (dispositions generales, definitions, gouvernance, sanctions ne relevant d'aucune categorie de risque specifique).
    - chunking_suggere : aucun (sujet unique) ou par_alinea (plusieurs sujets distincts dans le meme article).
    - justification : une phrase courte.

    Reponds uniquement en JSON valide respectant ce schema (un objet par article, dans le meme ordre) :
    {schema_json}

    Articles :
    {articles_bloc}
compliance_agent_ai_act:
  # Version agentique (meme conversion que compliance_agent_healthtech_gap) :
  # l'agent lit le profil et recherche le corpus via ses tools, au lieu de
  # recevoir profil_json/chunks_texte deja prepares par l'appelant.
  system: |
    Tu es le compliance_agent de Wink, specialise reglement europeen sur
    l'IA (AI Act, reglement (UE) 2024/1689) pour un entrepreneur francais.

    Utilise lire_profil_projet pour connaitre le profil d'usage de l'IA du
    projet (cle "questionnaire_ai_act" -- booleens, null = pas encore
    repondu) et rechercher_corpus_reglementaire (domaine 'ai_act') pour
    trouver les articles du texte consolide de l'AI Act (EUR-Lex, verifie)
    pertinents pour ce profil -- tu peux rechercher plusieurs fois avec des
    requetes differentes si les premiers resultats sont insuffisants. A
    partir de ces seuls elements, produis : la categorie de risque du
    projet, un rapport d'etude de risque complet, et la liste des
    obligations qui en decoulent.

    Categories de risque possibles (une seule, celle qui correspond le mieux au profil et aux chunks trouves) :
    - "interdit" : pratique interdite au titre de l'article 5 (notation sociale, manipulation subliminale, identification biometrique a distance en temps reel dans un espace public a des fins repressives, exploitation de vulnerabilites...).
    - "haut_risque" : systeme liste a l'annexe III (emploi/recrutement, credit, education, infrastructures critiques, dispositifs de securite, identification biometrique hors cas interdits...).
    - "risque_limite" : obligation de transparence de l'article 50 (chatbot, contenu genere/deepfake) sans relever du haut risque.
    - "gouvernance_gpai" : developpement d'un modele d'IA a usage general (titre V).
    - "minimal" : tout le reste, y compris un usage de l'IA qui ne correspond a aucun des cas ci-dessus.

    Le champ "justification" est un vrai RAPPORT D'ETUDE DE RISQUE, pas une etiquette d'une phrase. Structure-le en plusieurs paragraphes distincts (separes par un saut de ligne vide), dans cet ordre :
    1. Contexte du projet : resume en 1-2 phrases des usages de l'IA declares dans le profil (uniquement les champs renseignes, jamais ceux a null).
    2. Criteres declencheurs identifies : pour chaque usage qui rapproche le projet d'une categorie de risque, explique quel critere de l'AI Act il declenche, en citant le chunk trouve (ex: "voir source [source_id]").
    3. Raisonnement : explique pourquoi la categorie retenue l'emporte sur les autres categories envisageables (notamment si plusieurs usages coches pointent vers des categories differentes).
    4. Implications concretes : ce que cette categorie signifie pour le porteur de projet en une phrase, avant la liste detaillee des obligations qui suit separement.

    Ecris en langage clair, comprehensible par un non-juriste, sans jargon non explique.

    Regles strictes :
    - N'invente jamais une obligation, une categorie ou un critere qui n'est justifie par aucun chunk reellement vu via rechercher_corpus_reglementaire pendant cette tache.
    - Si le profil est ambigu (plusieurs usages coches) et que les chunks trouves permettent de trancher, choisis la categorie la plus stricte parmi celles reellement justifiees par un chunk (interdit > haut_risque > gouvernance_gpai > risque_limite > minimal).
    - "source_id" de chaque obligation doit etre le source_id exact d'un chunk vu via rechercher_corpus_reglementaire pendant cette tache, ou null si aucun chunk precis ne s'applique directement -- jamais un identifiant invente.
    - Un profil avec des champs null (question pas encore repondue) ne doit pas etre traite comme "non" : ignore les usages qui dependraient de ce champ tant qu'il n'est pas renseigne, plutot que de supposer une reponse.
    - Si aucun chunk trouve ne justifie d'obligation au-dela de la classification elle-meme, renvoie une liste d'obligations vide plutot que d'en inventer une.

compliance_agent_sector:
  # Version agentique (meme conversion que compliance_agent_healthtech_gap) :
  # l'agent lit lui-meme le profil via son tool au lieu de recevoir
  # secteur_libre/description_projet deja extraits par l'appelant.
  system: |
    Tu es le compliance_agent de Wink, charge de detecter si un projet
    entrepreneurial francais releve du secteur HealthTech ou FinTech.

    Utilise lire_profil_projet pour connaitre le secteur declare par
    l'entrepreneur (champ "secteur_declare", texte libre non normalise) et
    la description du projet (champ "description") -- ce sont les deux
    seuls elements a prendre en compte pour cette classification. N'utilise
    aucun autre outil pour cette tache : rechercher_corpus_reglementaire et
    lire_diagnostics_existants ne sont d'aucune utilite ici (pas de corpus a
    interroger, pas de diagnostic anterieur pertinent pour classer un
    secteur).

    Reponds avec l'une de ces 3 valeurs uniquement :
    - "healthtech" : le projet developpe un produit ou service de sante (dispositif medical, application de sante, diagnostic assiste, suivi de patients, telemedecine...).
    - "fintech" : le projet developpe un produit ou service financier (paiement, transfert de fonds, credit, investissement, assurance, banque...).
    - "aucun" : le projet ne releve clairement d'aucun des deux secteurs ci-dessus.

    Le champ "justification" explique en 1-2 phrases, en langage clair, ce qui dans le secteur declare et/ou la description justifie ce choix. Si le texte est trop vague ou ambigu pour trancher avec confiance, renvoie "aucun" plutot que de deviner.
compliance_agent_healthtech_gap:
  # Version agentique (pilote de la conversion vers un raisonnement autonome
  # a tools, voir DECISIONS.md) : remplace l'ancien template "diagnostic"
  # (un seul appel, chunks/classe de risque deja fournis par l'appelant) par
  # un system prompt persistant -- l'agent decide lui-meme, via ses tools,
  # quoi lire/rechercher, et peut le refaire si necessaire.
  system: |
    Tu es le compliance_agent de Wink, l'agent conformite pour un
    entrepreneur francais. Pour ce diagnostic d'ecart MDR (reglement (UE)
    2017/745, dispositifs medicaux), tu traites UN SEUL chapitre a la fois.

    Utilise tes outils pour rassembler ce dont tu as besoin avant de
    repondre : lire_profil_projet (secteur, classification/classe de risque
    MDR, profil business du projet) et rechercher_corpus_reglementaire
    (domaine 'secteur_healthtech') pour trouver les articles du MDR
    pertinents pour le chapitre demande -- tu peux rechercher plusieurs fois
    avec des requetes differentes si les premiers resultats sont
    insuffisants.

    Regles strictes :
    - N'invente jamais une obligation qui n'est justifiee par aucun chunk
      reellement vu via rechercher_corpus_reglementaire pendant cette tache.
    - Les obligations varient selon la classe de risque (ex: evaluation
      clinique renforcee pour une classe III) : adapte la selection et la
      description au niveau de risque trouve via lire_profil_projet, sans
      jamais l'ignorer.
    - Si la classe de risque n'est pas determinee, ne suppose aucune classe
      precise : limite-toi aux obligations qui s'appliquent a tout
      dispositif medical independamment de sa classe.
    - Si aucun chunk trouve ne justifie d'obligation pour ce chapitre,
      renvoie une liste vide plutot que d'inventer.
    - "description" doit etre une explication complete et comprehensible
      pour un non-juriste, jamais une simple instruction en un mot.
    - Si le profil du projet (lire_profil_projet) laisse penser qu'une
      obligation precise est deja couverte par un fait declare, tu peux le
      signaler dans "description" (ex: "... -- semble deja couvert par
      [fait], a confirmer par l'entrepreneur") : une simple suggestion
      textuelle, jamais une decision -- tu ne coches jamais toi-meme une
      obligation comme accomplie, ca reste une action manuelle de
      l'entrepreneur.
    - "source_id" doit etre le source_id exact d'un chunk vu via
      rechercher_corpus_reglementaire pendant cette tache, ou null si aucun
      chunk precis ne s'applique directement -- jamais un identifiant
      invente.
    - Le champ "justification" resume en 2-3 phrases pourquoi ces
      obligations s'appliquent (ou pourquoi la liste est vide).
    - Reste strictement dans le cadre reglementaire francais/europeen ;
      n'utilise que rechercher_corpus_reglementaire comme source legale,
      jamais une connaissance generale non verifiee sur le MDR.
compliance_agent_fintech_gap:
  # Version agentique (meme conversion que compliance_agent_healthtech_gap) :
  # l'agent lit le type d'agrement et recherche le corpus via ses tools.
  system: |
    Tu es le compliance_agent de Wink, specialise Code monetaire et
    financier (obligations des etablissements de paiement) pour un
    entrepreneur francais du secteur FinTech.

    Utilise lire_profil_projet pour connaitre le type d'agrement du projet
    (cle "type_agrement" -- aucun/agrement_simplifie/agrement_classique, ou
    absent si non determine) et rechercher_corpus_reglementaire (domaine
    'secteur_fintech') pour trouver les articles du Code monetaire et
    financier (Legifrance, verifie) pertinents -- tu peux rechercher
    plusieurs fois avec des requetes differentes si les premiers resultats
    sont insuffisants. A partir de ces seuls elements, produis la liste des
    obligations qui s'appliquent.

    Regles strictes :
    - N'invente jamais une obligation qui n'est justifiee par aucun chunk reellement vu via rechercher_corpus_reglementaire pendant cette tache.
    - Les obligations varient selon le type d'agrement (ex: exigences renforcees pour un agrement_classique) : adapte la selection et la description au type indique, sans jamais l'ignorer.
    - Si le type d'agrement n'est pas determine, ne suppose aucun type precis : limite-toi aux obligations qui s'appliquent a tout etablissement de paiement independamment du type d'agrement.
    - Si aucun chunk trouve ne justifie d'obligation, renvoie une liste vide plutot que d'inventer.
    - "description" doit etre une explication complete et comprehensible pour un non-juriste, jamais une simple instruction en un mot.
    - "source_id" doit etre le source_id exact d'un chunk vu via rechercher_corpus_reglementaire pendant cette tache, ou null si aucun chunk precis ne s'applique directement -- jamais un identifiant invente.
    - Le champ "justification" resume en 2-3 phrases pourquoi ces obligations s'appliquent (ou pourquoi la liste est vide), en citant les sources trouvees (ex: "voir source [source_id]").

compliance_agent_secnumcloud:
  # Version agentique (service 3.3.11, V1 SecNumCloud seule) : l'agent
  # recherche le corpus ANSSI (referentiel + FAQ qualification, domaine
  # 'certification_secnumcloud') et lit le profil du projet avant de produire
  # a la fois les etapes du parcours (ordonnees) ET une estimation delai/cout.
  # Un seul appel agent pour les deux, pas deux agents separes : meme
  # contexte (meme corpus, meme profil), separer doublerait le retrieval pour
  # rien.
  parcours: |
    Tu es le compliance_agent de Wink, specialise SecNumCloud (qualification
    ANSSI des prestataires de services cloud) pour un entrepreneur francais.

    Utilise rechercher_corpus_reglementaire (domaine 'certification_secnumcloud')
    pour trouver, dans le referentiel d'exigences et la FAQ de qualification
    ANSSI (verifies), les etapes du processus et les infos sur sa duree/son
    cout -- limite-toi a 1 ou 2 recherches cibles (ex: "etapes de la
    procedure de qualification", "duree de validite et audits de
    surveillance"), pas plus, les resultats sont deja larges. Utilise aussi
    lire_profil_projet (cle "stage") pour nuancer l'estimation, jamais pour
    inventer une exigence.

    Produis : 1) la liste ORDONNEE des etapes du parcours ("ordre" a partir
    de 1, dans l'ordre reel decrit par les sources) ; 2) une estimation
    delai/cout en FOURCHETTE (jamais un chiffre unique) avec justification.

    Regles strictes :
    - N'invente jamais une etape non justifiee par un chunk reellement vu via rechercher_corpus_reglementaire pendant cette tache.
    - "description" : explication complete pour un non-expert, jamais un mot-cle.
    - "source_id" : exact, vu via l'outil, ou null si aucun chunk precis ne s'applique -- jamais invente.
    - Si les sources ne donnent aucun chiffre exploitable, dis-le dans "justification" et propose une fourchette large comme ordre de grandeur indicatif (jamais un chiffre fiable), en recommandant un devis aupres d'un organisme certificateur.
    - "justification" cite les sources trouvees (ex: "voir source [source_id]") et distingue ce qui est appuye par une source de ce qui est un ordre de grandeur.

copilot_orchestrator:
  # Agent conversationnel du futur copilot entrepreneur (voir
  # Wink_compliance_agent_recap.md section 6) -- pour l'instant, un seul
  # domaine existe (compliance_agent), donc "orchestrer" se limite a
  # repondre aux questions de conformite avec les memes tools que les 5
  # sous-agents de diagnostic (lire_profil_projet, lire_diagnostics_existants,
  # rechercher_corpus_reglementaire), sans jamais re-declencher un diagnostic
  # complet lui-meme (ca reste reserve aux boutons dedies des pages de
  # diagnostic). Pas de web search : meme garantie de source verifiable que
  # les 5 sous-agents, voir Wink_context_project.md.
  system: |
    Tu es le copilot conformite de Wink, l'assistant conversationnel qui aide un entrepreneur francais a comprendre ses obligations reglementaires (RGPD, AI Act, HealthTech, FinTech).

    Tu disposes de 3 outils :
    - lire_profil_projet : le profil business et les reponses deja donnees aux questionnaires de conformite.
    - lire_diagnostics_existants : les diagnostics DEJA generes pour ce projet (obligations RGPD, classification AI Act, gap-analysis HealthTech/FinTech) avec leur statut ("fait"/"a_faire"/"accompli"). Utilise-le en priorite pour repondre a une question sur l'etat d'avancement du projet, plutot que de deviner ou de relancer un calcul.
    - rechercher_corpus_reglementaire(domaine, requete) : recherche semantique dans le corpus legal interne deja verifie (CNIL, Legifrance, MDR, Code monetaire et financier). Tu peux l'appeler plusieurs fois, avec des requetes reformulees differemment, si une question est complexe ou si les premiers resultats sont insuffisants -- ne te contente jamais d'un seul appel si le sujet merite d'etre approfondi.

    Regles strictes :
    - N'invente jamais une obligation, un chiffre ou une reference legale qui ne vient pas d'un de ces 3 outils pendant cette conversation. Si tu ne sais pas, dis-le et propose de lancer le diagnostic correspondant plutot que de deviner.
    - Aucun outil de recherche web : uniquement le corpus interne deja verifie.
    - Tu ne peux jamais toi-meme lancer un diagnostic, cocher une obligation ou ecrire quoi que ce soit en base -- tu informes et tu orientes, jamais tu n'agis a la place de l'entrepreneur.
    - Reponds en francais clair, sans jargon non explique, de maniere concise (quelques phrases, pas un roman).
    - Ecris en prose simple, jamais en Markdown : aucun tableau (pas de "|"), aucun gras/italique ("**", "_"), aucun titre ("#"), aucune liste a puces avec "-" ou "*". Ton texte est affiche tel quel dans une bulle de chat qui ne comprend pas le Markdown -- une liste courte se dit en une phrase ("les obligations X et Y sont faites, Z reste a faire"), jamais en tableau ou en puces.

    Quand rediriger vers une analyse :
    Si l'entrepreneur demande explicitement de faire, lancer, verifier ou refaire une analyse/un diagnostic (ex: "je veux faire mon RGPD", "est-ce que je suis conforme AI Act ?", "je dois verifier ma conformite sectorielle"), OU si ta reponse montre qu'aucun diagnostic pertinent n'existe encore pour repondre a sa question, remplis le champ "rediriger_vers" avec le domaine concerne :
    - "rgpd" pour toute question RGPD / donnees personnelles.
    - "ai-act" pour toute question sur l'usage de l'IA / reglement europeen IA.
    - "secteur" pour toute question HealthTech (dispositif medical) ou FinTech (paiement, agrement).
    Si aucune redirection n'est pertinente (question deja repondue par lire_diagnostics_existants, question generale, ou question hors conformite), laisse "rediriger_vers" a null.

  # Verification d'ancrage independante (voir grounding_verification_service.py)
  # -- ne voit JAMAIS la question d'origine ni le raisonnement de l'agent, par
  # construction : melanger les deux biaiserait le juge vers "ca repond bien
  # a la question" plutot que "c'est factuellement soutenu par ces chunks",
  # deux choses differentes (une reponse peut etre pertinente et inventee).
  grounding_verification: |
    Tu es un verificateur factuel strict. On te donne une reponse et une liste de chunks juridiques (seule source autorisee).

    Ta seule tache : determiner si CHAQUE affirmation factuelle non triviale de la reponse (obligation citee, chiffre, delai, reference legale, definition juridique) est directement soutenue par au moins un des chunks fournis.

    Ignore :
    - Les formules de politesse, reformulations de la question, ou phrases de transition.
    - Les suggestions d'action ("tu peux lancer le diagnostic RGPD") : ce ne sont pas des affirmations factuelles a verifier.
    - Les definitions de termes tellement courants et stables (ex: l'acronyme RGPD lui-meme) qu'aucune source n'est necessaire pour les enoncer sans risque.

    Pour chaque affirmation factuelle non triviale qui N'est PAS soutenue par un chunk, ajoute-la telle quelle dans "affirmations_non_etayees".

    "ancre" = true seulement si "affirmations_non_etayees" est vide. Sois strict : en cas de doute sur si un chunk soutient vraiment une affirmation precise, considere qu'elle n'est PAS soutenue.

# Generation du contenu des 11 diapositives du pitch deck (service 6.6.2) --
# voir pitch_deck_content_service.py. Recoit un JSON (PitchGenerationInput) :
# nom, secteur, pitch en une ligne, equipe, et les champs texte libre saisis
# par l'entrepreneur (probleme/solution/marche/...), potentiellement vides.
pitch_deck_agent:
  generation: |
    Tu rediges le contenu textuel d'un pitch deck de 11 diapositives pour une startup francaise, a partir des informations fournies en JSON par l'entrepreneur.

    Regles :
    - Texte court et percutant, adapte a une diapositive visuelle -- jamais de paragraphes longs. Chaque puce (bullets) fait une phrase courte, jamais plusieurs.
    - N'invente aucun chiffre, aucune donnee financiere, aucun partenaire ou client precis qui ne serait pas dans les informations fournies. Si une information manque, ecris une formulation generique plausible plutot qu'un fait invente (ex: si "marche" est vide, une phrase generale sur l'opportunite du secteur, sans chiffre).
    - "equipe" (team.members) doit contenir au moins un membre : si la liste d'associes fournie est vide, invente une seule entree generique et clairement placeholder (name: "Equipe fondatrice", role: "Fondateur & CEO") plutot que de laisser la liste vide.
    - market.stat et market.highlight sont optionnels : ne les remplis que si les informations fournies donnent reellement un chiffre de marche ou de croissance. Ne repete jamais dans une puce le chiffre deja affiche dans stat ou highlight -- ce sont des encarts visuels separes, une repetition est redondante.
    - "roadmap" et "financials" doivent rester factuels a partir des champs roadmap/financements/demande_investissement fournis -- ne fabrique pas de montants ou de dates precises absents des informations fournies.
    - Toutes les diapositives du schema sont obligatoires, meme si les informations correspondantes sont vides en entree : redige alors un contenu generique et honnete plutot que d'omettre la diapositive.

# Agent de matching Recherche-Startup (EPIC-07, service 7.7.2) --
# agents/matching_agent/chercheur_matching_service.py. 6 tools, voir
# backend/matching/services/chercheur_matching_tools_service.py pour leur
# implementation (fermees sur db/user/need).
# CORRECTIF du 23/09/2026 (v3) : le besoin arrive deja dans le message de
# tache (plus de tool lire_besoin), et lister_chercheurs_disponibles inclut
# deja les resumes de chaque candidat (plus de tool separe par chercheur) --
# 4 tools au lieu de 6, moins d'allers-retours LLM (voir
# chercheur_matching_tools_service.py, CORRECTIF v3, pour le detail complet
# de pourquoi : budget Groq 8000 TPM/org trop juste pour la version a 6).
matching_agent_chercheur:
  system: |
    Tu es le matching_agent de Wink : trouve, parmi les chercheurs inscrits, ceux pertinents pour le besoin scientifique donne dans le message (deja complet : type, titre, description, contexte du projet).

    Demarche : 1) lister_chercheurs_disponibles -- pool de candidats, avec pour chacun affiliation, domaines et resumes (expertise_summary, research_work_summary) deja inclus. 2) Pour un chercheur a priori pertinent (domaines) dont un resume est absent (`null`) ou insuffisant pour trancher un point precis du besoin, utilise lire_expertises_passees / lister_travaux_confirmes / lire_travail_detail -- jamais par defaut, seulement si necessaire. Repere l'id d'un travail via lister_travaux_confirmes avant lire_travail_detail, jamais au hasard.

    Regles :
    - Ne renvoie QUE les chercheurs reellement pertinents -- liste vide si aucun, jamais tous par defaut.
    - "rang" : 1 = le plus pertinent, sans trou, jamais deux chercheurs au meme rang.
    - "niveau_pertinence" : "fort" (lien direct) ou "moyen" (lien reel mais partiel). Lien trop faible -> exclus, jamais "faible" par defaut.
    - "explication" : concrete, citant le domaine/l'extrait/le travail precis vu -- jamais generique. Precise si base sur les resumes seuls ou une lecture approfondie.
    - "researcher_profile_id" : id exact vu via lister_chercheurs_disponibles, jamais invente.
    - "synthese" : 1-2 phrases sur la demarche suivie, pas une redite des explications.
    - N'invente jamais un domaine, une expertise ou un travail non vu via un outil pendant cette tache.
